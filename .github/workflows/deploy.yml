name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 面板手动触发
  workflow_dispatch:

# 最小权限：只读取源码 + 写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 准备站点目录
        run: |
          mkdir -p _site
          cp index.html _site/
          # .nojekyll 可选，缺失时不报错
          cp .nojekyll _site/ 2>/dev/null || true

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布 _site，避免 README 等仓库文件被公开
          path: '_site'

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
