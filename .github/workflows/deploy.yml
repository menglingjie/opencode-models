name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 面板手动触发
  workflow_dispatch:

# 最小权限：只读取源码 + 写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录就是仓库根目录，index.html 在顶层
          path: '.'

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
